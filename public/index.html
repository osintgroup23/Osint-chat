<!DOCTYPE html><html><head><title>OSINT Group</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;display:flex;flex-direction:column;height:100vh}header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #00ff88}header h1{margin:0;color:#00ff88}#chat{flex:1;overflow-y:auto;padding:15px}#input{display:flex;padding:10px;background:#111}#msg{flex:1;padding:12px;border:none;background:#222;color:#fff;border-radius:20px}button{padding:12px 18px;margin-left:10px;background:#00ff88;color:#000;border:none;border-radius:20px;font-weight:bold}.msg{margin:10px 0;padding:10px 14px;background:#1a1a1a;border-radius:12px;max-width:80%}.me{background:#003322;color:#00ff88;margin-left:auto}.user{font-size:12px;opacity:.7}</style></head><body><header><h1>OSINT Group</h1></header><div id="chat"></div><div id="input"><input id="msg" placeholder="Message..."/><button onclick="sendMsg()">Send</button></div><script src="/socket.io/socket.io.js"></script><script>const socket=io();const chat=document.getElementById('chat');const msgInput=document.getElementById('msg');let username=localStorage.getItem("osint_user");if(!username){username=prompt("Enter your name:");if(!username)username="Guest"+Math.floor(Math.random()*999);localStorage.setItem("osint_user",username);}function addMsg(data,isMe){const div=document.createElement('div');div.className='msg'+(isMe?' me':'');div.innerHTML=`<div class="user">${data.user}</div>${data.msg}`;chat.appendChild(div);chat.scrollTop=chat.scrollHeight}socket.on('init',(msgs)=>{msgs.forEach(m=>addMsg(m,m.user===username))});socket.on('send',(data)=>{addMsg(data,false)});function sendMsg(){const msg=msgInput.value.trim();if(msg){const data={user:username,msg:msg};addMsg(data,true);socket.emit('send',data);msgInput.value=''}}msgInput.addEventListener("keypress",(e)=>{if(e.key==="Enter")sendMsg()});</script></body></html>
